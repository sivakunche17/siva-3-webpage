      return {
        jsx: function(type, props, key) {
          var p = Object.assign({}, props);
          if (key !== undefined) p.key = key;
          return React.createElement(type, p);
        },
        jsxs: function(type, props, key) {
          var p = Object.assign({}, props);

        },
        Fragment: React.Fragment

<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  // Custom useTypewriter Hook
  function useTypewriter(text, speed = 38, startDelay = 600) {
    const [displayed, setDisplayed] = useState("");
    const [done, setDone] = useState(false);

    useEffect(() => {
      let index = 0;
      let timer = null;
      const delayTimeout = setTimeout(() => {
        timer = setInterval(() => {
          index++;
          setDisplayed(text.slice(0, index));
          if (index >= text.length) {
            clearInterval(timer);
            setDone(true);
          }
        }, speed);
      }, startDelay);

      return () => {
        clearTimeout(delayTimeout);
        if (timer) clearInterval(timer);
      };
    }, [text, speed, startDelay]);

    return { displayed, done };
  }

  function App() {
    const videoRef = useRef(null);
    const isSeekingRef = useRef(false);
    const targetTimeRef = useRef(0);
    const prevXRef = useRef(null);
    const [menuOpen, setMenuOpen] = useState(false);
    const [pillsVisible, setPillsVisible] = useState(false);
    const [copied, setCopied] = useState(false);
    const [scrolled, setScrolled] = useState(false);

    // Typewriter hook
    const typewriterContent = "Glad you stopped in. Good taste tends to find us. Now, what are we building?";
    const { displayed, done } = useTypewriter(typewriterContent, 38, 600);

    // Pill buttons reveal delay (400ms after load)
    useEffect(() => {
      const timer = setTimeout(() => {
        setPillsVisible(true);
      }, 400);
      return () => clearTimeout(timer);
    }, []);

    // Navbar scroll listener for smooth dark frosted transition
    useEffect(() => {
      const handleScroll = () => {
        setScrolled(window.scrollY > 80);
      };
      window.addEventListener('scroll', handleScroll, { passive: true });
      return () => window.removeEventListener('scroll', handleScroll);
    }, []);

    // Reactive listener to ensure ProcessTimeline component is detected upon load
    const [timelineReady, setTimelineReady] = useState(
      () => !!(window.ProcessTimeline || window.exports?.default || window.module?.exports?.default)
    );

    useEffect(() => {
      if (timelineReady) return;
      const checkInterval = setInterval(() => {
        if (window.ProcessTimeline || window.exports?.default || window.module?.exports?.default) {
          setTimelineReady(true);
          clearInterval(checkInterval);
        }
      }, 40);
      return () => clearInterval(checkInterval);
    }, [timelineReady]);

    // Video Mouse Scrub Logic
    useEffect(() => {
      const video = videoRef.current;
      if (!video) return;

      const handleLoadedMetadata = () => {
        if (video.duration) {
          targetTimeRef.current = video.duration * 0.45;
          video.currentTime = targetTimeRef.current;
        }
      };

      video.addEventListener('loadedmetadata', handleLoadedMetadata);

      const SENSITIVITY = 0.8;

      const handleMouseMove = (e) => {
        const currentX = e.clientX;
        if (prevXRef.current === null) {
          prevXRef.current = currentX;
          return;
        }

        const delta = currentX - prevXRef.current;
        prevXRef.current = currentX;

        if (!video.duration || isNaN(video.duration)) return;

        const timeOffset = (delta / window.innerWidth) * SENSITIVITY * video.duration;
        targetTimeRef.current = Math.max(0, Math.min(video.duration, targetTimeRef.current + timeOffset));

        if (!isSeekingRef.current) {
          isSeekingRef.current = true;
          video.currentTime = targetTimeRef.current;
        }
      };

      const handleSeeked = () => {
        if (!video || !video.duration) return;
        if (Math.abs(video.currentTime - targetTimeRef.current) > 0.04) {
          video.currentTime = targetTimeRef.current;
        } else {
          isSeekingRef.current = false;
        }
      };

      window.addEventListener('mousemove', handleMouseMove);
      video.addEventListener('seeked', handleSeeked);

      return () => {
        window.removeEventListener('mousemove', handleMouseMove);
        video.removeEventListener('seeked', handleSeeked);
        video.removeEventListener('loadedmetadata', handleLoadedMetadata);
      };
    }, []);

        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      }).catch(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      });
    };

    const scrollToProcess = () => {

      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
      }
    };

            Labs

          <button

              setMenuOpen(false);
              scrollToProcess();
            }}
            className="text-[30px] text-white font-medium hover:opacity-60 transition-opacity text-left bg-transparent border-0 p-0"
          >
            Process
          </button>
          <a 
            href="#studio" 
            onClick={() => setMenuOpen(false)}
            className="text-[30px] text-white font-medium hover:opacity-60 transition-opacity"
          >
            Studio
          </a>
          <a

          </a>
          <a

            Shop
          </a>
          <div className="pt-4 w-full border-t border-white/20">
            <a

        {/* PAGE 1: HERO SECTION */}

          <video
